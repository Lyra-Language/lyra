name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **The tests run as shards in parallel**, each on its own runner (10/29). One job ran them
  # in 15-17 minutes, nearly all of it cmd/lyrac, whose `TestRun_Ui*` tests each build a
  # program holding the whole `ui` framework: ~2,150 test-seconds on a 4-core runner. ui-b is
  # "every TestRun_Ui but A–O" rather than "P–Z", and lyrac every test no other shard runs,
  # so a test of any name lands in exactly one shard. The repository is public, so parallel
  # jobs cost nothing.
  test:
    name: build & test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard's failures are worth seeing, not only the first one's.
      fail-fast: false
      matrix:
        include:
          - shard: ui-a
            packages: ./cmd/lyrac
            select: -run '^TestRun_Ui[A-O]'
          - shard: ui-b
            packages: ./cmd/lyrac
            select: -run '^TestRun_Ui' -skip '^TestRun_Ui[A-O]'
          # lui's markup tests build `ui` programs too (~375 test-seconds), which left
          # the lyrac shard the slowest by three minutes.
          - shard: lui
            packages: ./cmd/lyrac
            select: -run '^(TestLui|TestMarkup)'
          - shard: lyrac
            packages: ./cmd/lyrac
            select: -skip '^(TestRun_Ui|TestLui|TestMarkup)'
          # Every package but cmd/lyrac (listed in the step), and the formatting check.
          - shard: rest
            packages: ""
            select: ""
    env:
      # Use the SDK that setup-go installs (read from go.mod) directly, rather
      # than letting `go` fetch a separate module toolchain — the module
      # toolchain ships without the `covdata` tool that -coverpkg needs to
      # write coverage for packages that have no in-package tests.
      #
      # setup-go v6 began setting this itself (actions/setup-go#460), so this is
      # now belt-and-braces — kept deliberately, because the reason above is not
      # recoverable from the action's default and a future action that stopped
      # setting it would break coverage silently rather than loudly.
      GOTOOLCHAIN: local
    steps:
      # The main module. Kept in a subdirectory so the tree-sitter grammar
      # can sit next to it as a sibling, matching the `replace` directive in
      # go.mod (`=> ../tree-sitter-lyra`).
      - name: Checkout lyra
        uses: actions/checkout@v7
        with:
          path: lyra

      # The tree-sitter grammar is a local `replace` dependency. Its src/parser.c is
      # ordinary tracked text since the state-explosion fix took it out of Git LFS, so
      # no `lfs: true` is needed. **The committed parser.c is what is tested**: this job
      # does not regenerate it (10/29 — `npm install` and `tree-sitter generate` were ~40s
      # of every shard), so a grammar change must be pushed with its regenerated parser.c.
      - name: Checkout tree-sitter-lyra grammar
        uses: actions/checkout@v7
        with:
          repository: Lyra-Language/tree-sitter-lyra
          path: tree-sitter-lyra

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: lyra/go.mod
          cache-dependency-path: lyra/go.sum

      # The CGO binding pulls the grammar in with `#include "../../src/parser.c"`
      # (tree-sitter-lyra/bindings/go/binding.go). Go's build cache hashes the .go
      # files and tracked cgo sources but NOT files brought in via #include, so a
      # parser.c changed since the cache setup-go restored was saved does not
      # invalidate it — the previously-compiled (stale) grammar is reused and tests
      # silently run against the old grammar. Wipe the build cache so the parser
      # recompiles from the checked-out parser.c. (This mirrors the local `go clean -cache`
      # step in the workspace CLAUDE.md "Critical Cross-Project Dependency".)
      - name: Invalidate cached compiled parser
        working-directory: lyra
        run: go clean -cache

      # The LLVM backend's behavioral tests compile emitted IR with clang and
      # run it (they self-skip when clang is absent). Installing clang here
      # keeps that coverage live in CI. libm (-lm), which the float tests
      # link against, ships with the runner's libc dev package.
      #
      # zlib1g-dev is for the FFI's **real-library** proof (`examples/zlib.lyra`, run by
      # TestExample_ZlibRoundTrips). The vendored C fixture shows the ABI is self-consistent
      # across a boundary this project wrote both sides of; only a library nobody wrote for
      # Lyra shows it matching a convention it had to obey rather than choose. `-lz` links
      # on macOS without a package and not on Linux, so the test self-skips when it is
      # missing — which is exactly why it is installed here rather than left to chance.
      #
      # lld is the linker an optimized `lyrac` build links its parts with, by ThinLTO
      # (cmd/lyrac/objects.go); without it such a build is made whole, and the parts' path
      # for optimized code would go untested here.
      #
      # libharfbuzz-dev and libfreetype-dev are `ui/`'s text (`bindings.harfbuzz`,
      # `bindings.freetype`), which every `ui.layout` program links: without them
      # TestRun_UiLayout, TestRun_UiCascade and TestFreetypeOffsets skip. (The pixel tests
      # skip here anyway, for want of SDL3.)
      - name: Install clang, zlib, HarfBuzz and FreeType
        run: |
          # Drop the runner image's third-party apt lists before updating. We need
          # `clang` and `zlib1g-dev` from Ubuntu's own repositories and nothing from
          # Google's Chrome repo — but `apt-get update` exits non-zero if *any* configured
          # source has a bad index, so a broken Chrome `Packages.gz` (which is what
          # happened, twice, on 09/09) fails the whole build before a line of Lyra is
          # compiled. Removing the list we do not use makes our build depend only on the
          # repositories it actually reads.
          # Matched by *content*, not filename: the runner image has moved between
          # `google-chrome.list` and deb822 `.sources` files, and removing a path that no
          # longer exists silently fixes nothing — which is what the first attempt did.
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y clang lld zlib1g-dev pkg-config libharfbuzz-dev libfreetype-dev

      # The formatter (`examples/lyrafmt`) links the tree-sitter **runtime** as a system
      # library, and `TestExample_LyrafmtRoundTrips` skips without it — which it silently
      # did on every run before 09/20, so the self-hosting probe was verified only on a
      # developer's machine while CI reported green.
      #
      # **Built from source, pinned, rather than `apt-get install libtree-sitter-dev`**:
      # the generated parser is ABI 15 (`LANGUAGE_VERSION` in src/parser.c) and Ubuntu's
      # package is far older, so the distro version installs, satisfies pkg-config, ends
      # the skip, and then fails at run time on a version mismatch — the one outcome worse
      # than skipping. The pin matches the `tree-sitter-cli` that generates the parser
      # (tree-sitter-lyra/package.json) and the workspace's asan.Dockerfile
      # (TREE_SITTER_VERSION); bump the three together.
      - name: Install the tree-sitter runtime
        env:
          TREE_SITTER_VERSION: 0.25.10
        run: |
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v${TREE_SITTER_VERSION}.tar.gz" | tar xz
          sudo make -C "tree-sitter-${TREE_SITTER_VERSION}" install PREFIX=/usr/local
          sudo ldconfig
          pkg-config --modversion tree-sitter

      - name: Build
        working-directory: lyra
        run: go build ./...

      - name: Vet
        working-directory: lyra
        run: go vet ./...

      # The backend's behavioural tests keep each program they compile, keyed on its IR, flags
      # and clang (pkg/backend/llvm/exec_cache_test.go): kept between runs, a test whose IR a
      # commit did not change skips clang. Restored from the newest run's (a run's key is its
      # own, so every run saves), and pruned after the tests to what this run used — the
      # marker's time, which only a hit or a new binary passes — so it holds one tree's
      # programs rather than every run's.
      # The backend tests are in the rest shard alone, so it alone keeps their binaries.
      - name: Restore the backend tests' binaries
        if: matrix.shard == 'rest'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lyra-llvm-tests
          key: lyra-llvm-tests-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lyra-llvm-tests-${{ runner.os }}-

      - name: Mark the binaries' time
        if: matrix.shard == 'rest'
        run: mkdir -p ~/.cache/lyra-llvm-tests && touch "$RUNNER_TEMP/tests-began" && sleep 1

      # -coverpkg=./... instruments every package so tests that live in a
      # separate `…/tests` subpackage (collector, typechecker) are credited
      # against the code they exercise. Without it those packages read as
      # near-zero. Coverage is informational only — the profile is uploaded
      # as an artifact but does not gate the build.
      #
      # -v so that a passing test's `t.Logf` reaches the log: the timing guards
      # (TestExec_SplitIsNotQuadratic) print the ratio they measured, and the
      # runner's own numbers are the ones worth watching drift in — without -v
      # they are visible only on the run that already failed.
      #
      # -timeout 30m: headroom. cmd/lyrac's tests each compile and link a whole program;
      # they run in parallel, but a runner has few cores and they once took the package
      # past go test's default 10 minutes.
      #
      # A shard's profile is uploaded, and the coverage job below merges them.
      - name: Test with coverage
        working-directory: lyra
        run: |
          packages="${{ matrix.packages }}"
          if [ -z "$packages" ]; then
            packages=$(go list ./... | grep -v '/cmd/lyrac$')
          fi
          go test -v -timeout 30m -coverpkg=./... -coverprofile=cover.out ${{ matrix.select }} $packages

      # `lyrafmt --check .` over the repo, which is a step at all only because the walk now
      # reads `.lyrafmtignore` (the compiler's fixtures include a file meant not to parse).
      # It runs after the tests so a formatting complaint never hides a test result.
      #
      # It builds the formatter to do it, so it also covers `build.sh` and proves the
      # formatter *runs* on this architecture — which is not idle: it segfaulted on x86-64
      # until 09/20, and every machine in this project is aarch64.
      - name: Check formatting
        if: matrix.shard == 'rest'
        working-directory: lyra
        run: |
          ./build.sh
          build/lyrafmt --check .

      - name: Keep only the binaries this run used
        if: always() && matrix.shard == 'rest'
        run: |
          find ~/.cache/lyra-llvm-tests -type f ! -newer "$RUNNER_TEMP/tests-began" -delete
          echo "kept $(find ~/.cache/lyra-llvm-tests -type f | wc -l) binaries, $(du -sh ~/.cache/lyra-llvm-tests | cut -f1)"

      - name: Save the backend tests' binaries
        if: always() && matrix.shard == 'rest'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/lyra-llvm-tests
          key: lyra-llvm-tests-${{ runner.os }}-${{ github.run_id }}

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: lyra/cover.out
          if-no-files-found: ignore

  # The shards' profiles joined into one, and its total. Profiles from separate runs
  # concatenate (one `mode:` line kept); a block is covered when any shard covered it. The
  # total is counted here rather than by `go tool cover -func`, which needs the sources and
  # so a checkout and Go — it agrees with it to the tenth of a percent.
  coverage:
    name: coverage
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-*
          path: shards

      - name: Report total coverage
        run: |
          set -- shards/*/cover.out
          if [ ! -e "$1" ]; then echo "no shard wrote a profile"; exit 0; fi
          { head -1 "$1"; for f in "$@"; do tail -n +2 "$f"; done; } > cover.out
          total=$(awk 'NR>1 && !/^mode:/ { n[$1]=$2; if ($3>0) hit[$1]=1 }
            END { for (k in n) { t+=n[k]; if (hit[k]) c+=n[k] }; printf "%.1f%%", 100*c/t }' cover.out)
          echo "Total statement coverage (from $# shards): ${total}"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: cover.out
          if-no-files-found: ignore
