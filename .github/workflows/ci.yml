name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    env:
      # Use the SDK that setup-go installs (read from go.mod) directly, rather
      # than letting `go` fetch a separate module toolchain — the module
      # toolchain ships without the `covdata` tool that -coverpkg needs to
      # write coverage for packages that have no in-package tests.
      GOTOOLCHAIN: local
    steps:
      # The main module. Kept in a subdirectory so the tree-sitter grammar
      # can sit next to it as a sibling, matching the `replace` directive in
      # go.mod (`=> ../tree-sitter-lyra`).
      - name: Checkout lyra
        uses: actions/checkout@v4
        with:
          path: lyra

      # The tree-sitter grammar is a local `replace` dependency. Its src/parser.c is
      # ordinary tracked text since the state-explosion fix took it out of Git LFS, so
      # no `lfs: true` is needed — and this job regenerates it below in any case.
      - name: Checkout tree-sitter-lyra grammar
        uses: actions/checkout@v4
        with:
          repository: Lyra-Language/tree-sitter-lyra
          path: tree-sitter-lyra

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: lyra/go.mod
          cache-dependency-path: lyra/go.sum

       # Regenerate tree-sitter parser bindings to ensure they're in sync with grammar
      - name: Regenerate tree-sitter bindings
        working-directory: tree-sitter-lyra
        run: |
          npm install
          npm run build

      # The CGO binding pulls the grammar in with `#include "../../src/parser.c"`
      # (tree-sitter-lyra/bindings/go/binding.go). Go's build cache hashes the .go
      # files and tracked cgo sources but NOT files brought in via #include, so a
      # regenerated parser.c does not invalidate the cache that setup-go restored —
      # the previously-compiled (stale) grammar is reused and tests silently run
      # against the old grammar. Wipe the build cache so the parser recompiles from
      # the freshly generated parser.c. (This mirrors the local `go clean -cache`
      # step in the workspace CLAUDE.md "Critical Cross-Project Dependency".)
      - name: Invalidate cached compiled parser
        working-directory: lyra
        run: go clean -cache

      # The LLVM backend's behavioral tests compile emitted IR with clang and
      # run it (they self-skip when clang is absent). Installing clang here
      # keeps that coverage live in CI. libm (-lm), which the float tests
      # link against, ships with the runner's libc dev package.
      #
      # zlib1g-dev is for the FFI's **real-library** proof (`examples/zlib.lyra`, run by
      # TestExample_ZlibRoundTrips). The vendored C fixture shows the ABI is self-consistent
      # across a boundary this project wrote both sides of; only a library nobody wrote for
      # Lyra shows it matching a convention it had to obey rather than choose. `-lz` links
      # on macOS without a package and not on Linux, so the test self-skips when it is
      # missing — which is exactly why it is installed here rather than left to chance.
      - name: Install clang and zlib
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Build
        working-directory: lyra
        run: go build ./...

      - name: Vet
        working-directory: lyra
        run: go vet ./...

      # -coverpkg=./... instruments every package so tests that live in a
      # separate `…/tests` subpackage (collector, typechecker) are credited
      # against the code they exercise. Without it those packages read as
      # near-zero. Coverage is informational only — the profile is uploaded
      # as an artifact but does not gate the build.
      - name: Test with coverage
        working-directory: lyra
        run: go test -coverpkg=./... -coverprofile=cover.out ./...

      - name: Report total coverage
        working-directory: lyra
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $NF}')
          echo "Total statement coverage: ${total}"

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: lyra/cover.out
          if-no-files-found: ignore
